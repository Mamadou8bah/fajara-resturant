# Netlify — Fajara web (Next.js staff PWA + guest QR menu)
# https://docs.netlify.com/frameworks/next-js/overview/
#
# Independent app: this file lives with the web client.
#
# Monorepo: set Base directory = `client` (Netlify will read this file there).
# Standalone repo: Base directory = repository root (this file at root).

[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_APP_ENV = "staging"

# Set in Netlify → Environment variables (not committed):
#   NEXT_PUBLIC_API_URL = https://YOUR-API.onrender.com/api
#   NEXT_PUBLIC_WS_URL  = https://YOUR-API.onrender.com/realtime
#
# On the API host, set CORS_ORIGIN + PUBLIC_WEB_URL to this site's HTTPS origin.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
