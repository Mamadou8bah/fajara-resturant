# Render Blueprint — Fajara API (staging)
# https://render.com/docs/blueprint-spec
#
# Independent app: this file lives with the API.
#
# Monorepo: set Blueprint path to `server/render.yaml` (or Root Directory = server
# and use this file as `render.yaml` after splitting the repo).
# Standalone repo: keep this file at the repository root (rename/move as needed).
#
# Dashboard: set DATABASE_URL (Neon pooled), SEED_OWNER_PASSWORD, and after the
# web app is live set CORS_ORIGIN + PUBLIC_WEB_URL to the Netlify origin.
#
# Each deploy / boot on staging runs migrate + seed via start:staging
# (no Render shell required; seed is upsert-based / idempotent).
#
# If the service Build/Start Command was set in the Render dashboard, sync to:
#   Build: pnpm install --frozen-lockfile --prod=false && pnpm build
#   Start: pnpm start:staging
# Do not use `corepack enable` on Render (EROFS on /usr/bin/pnpm).
# (Dashboard overrides this file until you clear/sync it.)

services:
  - type: web
    name: fajara-api-staging
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    # Optional on paid plans; start:staging also migrates + seeds if this is unset.
    preDeployCommand: pnpm migrate:deploy && pnpm seed
    startCommand: pnpm start:staging
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production
      # Pin Node 20 on Render (engines allows >=20 for local).
      - key: NODE_VERSION
        value: "20"
      # Keep install from skipping build tools when NODE_ENV=production.
      - key: PNPM_PRODUCTION
        value: "false"
      # Neon pooled URL (do not commit). Paste in Render → Environment.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Web app origin(s) — set after Netlify (or other host) exists:
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SEED_PIN
        value: "1234"
      # Demo owner password for staging seed (change in dashboard if you want).
      - key: SEED_OWNER_PASSWORD
        value: "ChangeMe123!"
